services:
  postgres:
    container_name: 'world_storage_db'
    # Pinned major version: `latest` can silently jump majors and break the local data volume.
    image: 'postgres:16'
    restart: always
    user: postgres
    volumes:
      - postgres_volume:/var/lib/postgresql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=pass1234
      - POSTGRES_DB=world_storage
    ports:
      - '5432:5432'
  localstack:
    container_name: 'world_storage_localstack'
    image: 'localstack/localstack:3'
    restart: always
    environment:
      - SERVICES=sqs
      - DEFAULT_REGION=us-east-1
    ports:
      - '4566:4566'
    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack-init:/etc/localstack/init/ready.d
volumes:
  postgres_volume:
  localstack_data: